name: Analyze new weapon atlases
on:
  push:
    paths:
      - assets/weapons/new/modelosarmas.png
      - assets/weapons/new/modelosarmasmelee.png
      - tools/analyze_new_weapon_atlases.py
      - .github/workflows/analyze-new-weapons.yml
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pygame-ce
      - run: SDL_VIDEODRIVER=dummy python tools/analyze_new_weapon_atlases.py